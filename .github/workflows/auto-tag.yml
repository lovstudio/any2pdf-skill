name: Auto Tag on main
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'cases/**'
      - 'references/**'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate declared version
        id: ver
        run: |
          VER=$(grep -E '^  version:' SKILL.md | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          MANIFEST_VER=$(grep -E '^version:' skill.yaml | head -1 | sed -E 's/version:[[:space:]]*"?([^"[:space:]]+)"?/\1/')
          README_VER=$(grep -Eo 'badge/version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's|badge/version-||')
          test -n "$VER"
          test "$VER" = "$MANIFEST_VER"
          test "$VER" = "$README_VER"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Validated release version: $VER"

      - name: Check tag doesn't already exist
        id: check
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Tag declared version
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Extract release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          NEW="${{ steps.ver.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v ver="[$NEW]" '
              /^## / { if (found) exit; if (index($0, ver)) { found=1; next } }
              found { print }
            ' CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then NOTES="Release v$NEW"; fi
          {
            echo 'notes<<EOF_NOTES'
            echo "$NOTES"
            echo 'EOF_NOTES'
          } >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
